name: Aviso de pulumi up

# Só roda enquanto a publicação automática (AWS_INFRA_ROLE_ARN) não está configurada.
on:
  pull_request:
    paths:
      - 'server/**'
      - 'backend/**'
      - 'pulumi/**'
      - 'game/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  comentar:
    name: Avisar que precisa de pulumi up
    runs-on: ubuntu-latest
    # PRs de forks recebem um token sem permissão de comentar.
    # Com a infraestrutura automática configurada, o merge já roda o pulumi up.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.AWS_INFRA_ROLE_ARN == ''
    steps:
      - name: Comentar no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- aviso-pulumi -->'
          # Um comentário por PR, mesmo com vários pushes.
          if gh pr view "$PR" -R "$REPO" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            exit 0
          fi
          files=$(gh pr diff "$PR" -R "$REPO" --name-only | grep -E '^(server|backend|pulumi)/' | sed "s/.*/- \`&\`/")
          gh pr comment "$PR" -R "$REPO" --body "$marker
          ### Este PR precisa de \`pulumi up\` depois do merge

          Sem a publicação automática configurada, nada chega à AWS até quem tem a conta rodar o \`pulumi up\`, que agora publica jogo, placar e multiplayer juntos:

          $files

          Depois do merge, na \`main\` atualizada:
          \`\`\`bash
          cd pulumi
          pulumi stack select prod
          pulumi preview   # revise antes de aplicar
          pulumi up
          \`\`\`

          O passo a passo completo está em \`docs/deploy-aws.md\`."
