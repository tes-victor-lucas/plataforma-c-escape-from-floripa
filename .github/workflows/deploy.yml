name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    # Teste de integração do multiplayer contra um DynamoDB de verdade, rodando local.
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Instalar dependências do jogo
        working-directory: game
        run: npm ci
      - name: Verificar tipos
        working-directory: game
        run: npx tsc --noEmit
      - name: Testar o jogo
        working-directory: game
        run: npm test
      - name: Testar o multiplayer (unitário e integração com DynamoDB Local)
        working-directory: server
        run: npm ci && npm test
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
      - name: Testar a pontuação
        working-directory: backend
        run: python3 -m unittest discover -s tests
      - uses: astral-sh/setup-uv@v6
      - name: Testar a infraestrutura (Pulumi com recursos falsos)
        working-directory: pulumi
        run: uv run python -m unittest discover -s tests

  infra:
    name: Publicar jogo e infraestrutura
    needs: test
    # Sem a role e o token do Pulumi configurados no GitHub, nada é publicado (veja docs/deploy-aws.md).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_INFRA_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Dois pulumi up ao mesmo tempo disputam o lock da stack.
    concurrency:
      group: infra-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # O programa do Pulumi gera o build do jogo e envia cada arquivo ao S3.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: sa-east-1
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - name: Conferir o que está no ar
        run: |
          site=https://escape-from-floripa.negoci.online
          curl -fsS -o /dev/null "$site/"
          curl -fsS -o /dev/null "$site/api/leaderboard"
          cd server && npm ci && node scripts/smoke.js "wss://${site#https://}/ws" "$site"
