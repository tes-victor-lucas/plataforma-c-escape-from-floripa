  <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s1-cam", { x: -1920, y: -1900.0, scale: 5 }, { x: -1920, y: -1900.0, scale: 5, duration: 3.4 }, 0);
      tl.to("#s1-cam", { x: 0, y: -560.0, scale: 2.5, duration: 3.6, ease: "power2.inOut" }, 3.4);
      tl.fromTo("#s1-l0-box", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.27, ease: "steps(6)" }, 0.8);
      tl.fromTo("#s1-l1-box", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.27, ease: "steps(6)" }, 4.3);
      
      // Dissolução em blocos de 120 px, ordem fixa por semente (o filme renderiza igual sempre).
      function dissolve(tl, id, start, appear, seed) {
        const box = document.getElementById(id);
        const blocks = [];
        for (let i = 0; i < 144; i++) {
          const b = document.createElement('div');
          b.className = 'blk';
          b.style.left = (i % 16) * 120 + 'px';
          b.style.top = Math.floor(i / 16) * 120 + 'px';
          box.appendChild(b);
          blocks.push(b);
        }
        let s = seed;
        const order = blocks.map((b, i) => { s = (s * 1103515245 + 12345) % 2147483648; return [s, b]; })
          .sort((a, b) => a[0] - b[0]).map(([, b]) => b);
        order.forEach((b, i) => {
          tl.set(b, { opacity: appear ? 0 : 1 }, 0);
          tl.set(b, { opacity: appear ? 1 : 0 }, start + Math.floor(i / 12) * (0.4 / 12));
        });
      } dissolve(tl, "s1-dout", 7.08, true, 209458);
      window.__timelines["s1"] = tl;
