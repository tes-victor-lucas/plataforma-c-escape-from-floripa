  <script>

      /* Paleta do jogo: tons de noite das ilustrações do menu mais as cores do logo e dos mapas (fogo, neon, pele, folhas) e os cinzas-azulados do concreto dos tilesets. */
const GAME_PALETTE = [[1, 6, 15], [6, 9, 18], [6, 10, 19], [4, 13, 26], [2, 18, 34], [3, 19, 36], [3, 20, 38], [0, 21, 45], [0, 22, 46], [7, 25, 43], [70, 22, 39], [1, 76, 91], [62, 72, 88], [32, 134, 60], [99, 82, 53], [156, 32, 47], [76, 154, 57], [32, 100, 156], [233, 9, 49], [92, 102, 120], [40, 150, 140], [48, 204, 86], [150, 107, 90], [159, 61, 135], [102, 199, 61], [181, 132, 59], [226, 89, 75], [30, 137, 226], [132, 135, 138], [60, 255, 106], [128, 138, 156], [23, 201, 205], [255, 140, 40], [162, 207, 96], [90, 160, 219], [212, 91, 167], [240, 200, 40], [95, 248, 139], [226, 171, 87], [213, 174, 153], [180, 187, 193], [92, 229, 241], [255, 210, 122], [217, 221, 221], [255, 255, 255]];
/*
 * Animação 2D da abertura em pixel art: desenhada em 480x270, reduzida à paleta do jogo (GAME_PALETTE, de
 * lib/palette.js) com pontilhado ordenado e ampliada 4x sem suavizar, como os assets e a tela de início.
 * Silhuetas articuladas (personagem, multidão, robôs, drones), cenários em camadas e efeitos (fogo, chuva, fumaça).
 * render(t) é função pura de t: o HyperFrames busca quadros fora de ordem.
 */
function makeAnim2D(canvas, cfg) {
  // Desenho em coordenadas de 1920x1080, num canvas de 480x270: cada pixel do jogo vira 4x4 na tela.
  const W = 1920, H = 1080, LW = 480, LH = 270, SCALE = LW / W;
  const low = document.createElement('canvas');
  low.width = LW; low.height = LH;
  const ctx = low.getContext('2d');
  const out = canvas.getContext('2d');
  out.imageSmoothingEnabled = false;
  // Pontilhado ordenado (Bayer 4x4) e cor mais próxima da paleta, com cache por cor reduzida.
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v / 16 - 0.5) * 34);
  const nearestCache = new Map();
  function nearest(r, g, b) {
    const key = ((r >> 2) << 12) | ((g >> 2) << 6) | (b >> 2);
    let c = nearestCache.get(key);
    if (c === undefined) {
      let best = 1e9;
      for (let i = 0; i < GAME_PALETTE.length; i++) {
        const p = GAME_PALETTE[i];
        const dr = r - p[0], dg = g - p[1], db = b - p[2];
        const dist = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
        if (dist < best) { best = dist; c = i; }
      }
      nearestCache.set(key, c);
    }
    return GAME_PALETTE[c];
  }
  function toPalette() {
    const img = ctx.getImageData(0, 0, LW, LH);
    const d = img.data;
    for (let y = 0; y < LH; y++) {
      for (let x = 0; x < LW; x++) {
        const i = (y * LW + x) * 4, o = BAYER[(y & 3) * 4 + (x & 3)];
        const p = nearest(Math.max(0, Math.min(255, d[i] + o)), Math.max(0, Math.min(255, d[i + 1] + o)),
          Math.max(0, Math.min(255, d[i + 2] + o)));

  }
  const P = {
    navy: '#01141a', deep: '#061a26', blue: '#0b2a3d', steel: '#14303f', red: '#e90931', cyan: '#5ce5f1',
    amber: '#ffb347', fire: '#ff6a1a', yellow: '#ffd27a', ink: '#04060b', teal: '#1f8f86',
  };

  // --- acaso com semente --------------------------------------------------------------------------------------
  function rng(seed) {

      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);

  // --- luz e atmosfera ----------------------------------------------------------------------------------------
  function sky(top, bottom, horizon = H) {
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
  }
  function glow(x, y, r, color, alpha = 1) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }
  function sun(x, y, r) {
    glow(x, y, r * 3.2, 'rgba(233,9,49,0.55)');
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = P.red; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    // Faixas do sol do menu do jogo.
    ctx.fillStyle = 'rgba(1,20,26,0.85)';
    for (let k = 0; k < 6; k++) ctx.fillRect(x - r, y + r * 0.1 + k * r * 0.16, r * 2, r * 0.03 + k * r * 0.012);
    ctx.restore();
  }
  function rain(t, count, color, speed = 1900, slant = 0.18, seed = 3) {
    const r = rng(seed);
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.globalAlpha = 0.55;
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const x0 = r() * (W + 400) - 200, y0 = r() * H, len = 22 + r() * 30, v = speed * (0.8 + r() * 0.4);
      const y = ((y0 + v * t) % (H + 80)) - 40;
      const x = x0 - (y - y0) * slant * 0;
      ctx.moveTo(x + slant * y * 0.2, y);
      ctx.lineTo(x + slant * (y + len) * 0.2 + slant * len, y + len);
    }
    ctx.stroke();
    ctx.restore();
  }
  function smoke(x, y, t, seed, size = 1, color = 'rgba(30,26,30,') {
    const r = rng(seed);
    for (let i = 0; i < 9; i++) {
      const off = r(), sp = 0.18 + r() * 0.12;
      const age = (t * sp + off) % 1;
      const px = x + (r() - 0.5) * 80 * size + age * 140 * size, py = y - age * 420 * size;
      const rad = (40 + age * 140) * size;
      const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
      g.addColorStop(0, color + (0.55 * (1 - age)) + ')'); g.addColorStop(1, color + '0)');
      ctx.fillStyle = g; ctx.fillRect(px - rad, py - rad, rad * 2, rad * 2);
    }
  }
  function fire(x, y, size, t, seed) {
    const r = rng(seed);
    glow(x, y - 60 * size, 260 * size, 'rgba(255,110,30,0.55)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const off = r(), sp = 1.4 + r() * 1.1, dx = (r() - 0.5) * 90 * size;
      const age = (t * sp + off) % 1;
      const h = (90 + r() * 120) * size * (1 - age * 0.3);
      const w = (26 + r() * 22) * size * (1 - age);
      const sway = Math.sin(t * 9 + i) * 10 * size;
      const bx = x + dx * (1 - age * 0.5), by = y - age * 70 * size;
      const colors = ['rgba(255,240,170,', 'rgba(255,170,60,', 'rgba(255,80,30,'];
      const c = colors[i % 3];
      ctx.fillStyle = c + (0.75 * (1 - age)) + ')';
      ctx.beginPath();
      ctx.moveTo(bx - w, by);
      ctx.quadraticCurveTo(bx - w * 0.6 + sway, by - h * 0.55, bx + sway * 1.6, by - h);
      ctx.quadraticCurveTo(bx + w * 0.6 + sway, by - h * 0.55, bx + w, by);
      ctx.closePath();
      ctx.fill();
    }
    // Faíscas subindo.
    ctx.fillStyle = 'rgba(255,200,90,0.9)';
    for (let i = 0; i < 16; i++) {
      const off = r(), sp = 0.5 + r() * 0.6, age = (t * sp + off) % 1;
      ctx.globalAlpha = 1 - age;
      ctx.fillRect(x + (r() - 0.5) * 120 * size + Math.sin(age * 6 + i) * 20, y - age * 380 * size, 4, 4);
    }
    ctx.restore();
    smoke(x, y - 160 * size, t, seed + 7, size);
  }
  function explosion(x, y, age, size, seed) {
    if (age < 0 || age > 1.3) return;
    const k = clamp01(age / 0.45);
    glow(x, y, (180 + 520 * k) * size, `rgba(255,${Math.floor(200 - 120 * k)},80,${0.9 * (1 - k)})`);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const r = rng(seed);
    for (let i = 0; i < 18; i++) {
      const a = r() * Math.PI * 2, rad = (40 + r() * 140) * size * (0.3 + k);
      ctx.fillStyle = `rgba(255,${120 + Math.floor(r() * 120)},40,${0.85 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * rad * 0.6, y + Math.sin(a) * rad * 0.4, rad * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // Destroços com gravidade.
    ctx.fillStyle = P.ink;
    for (let i = 0; i < 16; i++) {
      const vx = (r() - 0.5) * 900 * size, vy = -(300 + r() * 700) * size, s = (6 + r() * 14) * size;
      const px = x + vx * age, py = y + vy * age + 1400 * size * age * age;
      ctx.save(); ctx.translate(px, py); ctx.rotate(age * 9 * (r() - 0.5)); ctx.fillRect(-s / 2, -s / 2, s, s * 0.6); ctx.restore();
    }
    smoke(x, y, age * 2.5, seed + 3, size * 1.4, 'rgba(24,20,26,');
  }

  // --- personagens articulados --------------------------------------------------------------------------------
  // Duas articulações por membro: o ângulo vem do ciclo de corrida, com fases e amplitudes diferentes.
  function limb(x, y, a1, l1, a2, l2, width) {
    const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
    const fx = kx + Math.sin(a1 + a2) * l2, fy = ky + Math.cos(a1 + a2) * l2;
    ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    return [fx, fy];
  }
  function figure(x, y, s, phase, o = {}) {
    const dir = o.dir || 1, run = o.run ?? 1, fill = o.fill || P.ink;
    const bob = Math.abs(Math.cos(phase)) * 9 * s * run;
    const hip = [x, y - 92 * s - bob];
    const lean = (o.lean ?? 0.28) * run * dir;
    const shoulder = [hip[0] + Math.sin(lean) * 62 * s, hip[1] - Math.cos(lean) * 62 * s];
    const sw = Math.sin(phase);
    ctx.save();
    ctx.strokeStyle = fill; ctx.fillStyle = fill; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const legs = [[sw, 1], [-sw, -1]];
    const legAngles = legs.map(([v, k]) => [dir * v * 0.95 * run, dir * (v < 0 ? -1 : -0.25) * Math.abs(v) * 1.3 * run - 0.05]);
    // Perna de trás, um pouco mais escura.
    ctx.globalAlpha = 0.85;
    limb(hip[0], hip[1], legAngles[1][0], 50 * s, legAngles[1][1] * -dir * dir, 50 * s, 15 * s);
    if (!o.shoot) limb(shoulder[0], shoulder[1] + 4 * s, dir * sw * 0.9 * run, 34 * s, -dir * (0.6 + Math.max(0, sw) * 0.6) * run, 32 * s, 11 * s);
    ctx.globalAlpha = 1;
    // Tronco e cabeça (a cabeça atrasa um pouco o passo).
    ctx.lineWidth = 30 * s;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(shoulder[0], shoulder[1]); ctx.stroke();
    const head = [shoulder[0] + dir * 6 * s + Math.sin(phase - 0.6) * 2 * s, shoulder[1] - 22 * s];
    ctx.beginPath(); ctx.arc(head[0], head[1], 15 * s, 0, Math.PI * 2); ctx.fill();
    limb(hip[0], hip[1], legAngles[0][0], 50 * s, legAngles[0][1] * -dir * dir, 50 * s, 16 * s);
    let muzzle = null;
    if (o.shoot) {
      // Braços estendidos segurando a arma.
      ctx.lineWidth = 11 * s;
      const hand = [shoulder[0] + dir * 64 * s, shoulder[1] + 6 * s + (o.recoil || 0) * -8 * s];
      ctx.beginPath(); ctx.moveTo(shoulder[0], shoulder[1] + 4 * s); ctx.lineTo(hand[0], hand[1]); ctx.stroke();
      ctx.fillRect(hand[0] - (dir < 0 ? 26 * s : 0), hand[1] - 6 * s, 26 * s, 9 * s);
      muzzle = [hand[0] + dir * 28 * s, hand[1] - 2 * s];
    } else {
      limb(shoulder[0], shoulder[1] + 4 * s, -dir * sw * 0.8 * run, 34 * s, -dir * (0.5 + Math.max(0, -sw) * 0.7) * run, 32 * s, 11 * s);
    }
    // Contorno aceso pela luz de trás (fogo, neon): o que faz a silhueta ler no escuro.
    if (o.rim) {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.restore(); ctx.save();
      ctx.strokeStyle = o.rim; ctx.lineWidth = 3 * s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(head[0], head[1], 15 * s, -Math.PI / 2 - dir * 1.2, -Math.PI / 2 + dir * 0.4, dir < 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shoulder[0] - dir * 14 * s, shoulder[1] - 4 * s); ctx.lineTo(hip[0] - dir * 14 * s, hip[1]); ctx.stroke();
    }
    if (o.accent) {  // detalhe de cor do personagem do jogo: cinto azul e tênis rosa
      ctx.fillStyle = '#3a5ad8'; ctx.fillRect(hip[0] - 15 * s, hip[1] - 4 * s, 30 * s, 7 * s);
    }
    ctx.restore();
    return { head, muzzle, hip };
  }
  function backFigure(x, y, s, t, o = {}) {
    // De costas, parado: ombros, casaco balançando no vento, cabeça olhando para cima.
    ctx.save();
    ctx.fillStyle = o.fill || P.ink;
    const breathe = Math.sin(t * 2.3) * 2 * s, wind = Math.sin(t * 3.1) * 6 * s;
    ctx.beginPath();
    ctx.moveTo(x - 46 * s, y - 210 * s + breathe);
    ctx.quadraticCurveTo(x, y - 232 * s + breathe, x + 46 * s, y - 210 * s + breathe);
    ctx.lineTo(x + 40 * s + wind, y - 90 * s);
    ctx.lineTo(x + 18 * s, y - 92 * s); ctx.lineTo(x + 20 * s, y); ctx.lineTo(x + 4 * s, y);
    ctx.lineTo(x, y - 80 * s); ctx.lineTo(x - 4 * s, y); ctx.lineTo(x - 20 * s, y); ctx.lineTo(x - 18 * s, y - 92 * s);
    ctx.lineTo(x - 40 * s + wind * 0.6, y - 90 * s);
    ctx.closePath(); ctx.fill();
    const lookUp = o.lookUp ? -8 * s : 0;
    ctx.beginPath(); ctx.ellipse(x, y - 250 * s + breathe + lookUp, 24 * s, 27 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (o.rim) {
      ctx.strokeStyle = o.rim; ctx.lineWidth = 4 * s;
      ctx.beginPath(); ctx.moveTo(x + 46 * s, y - 210 * s + breathe); ctx.lineTo(x + 40 * s + wind, y - 90 * s); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - 250 * s + breathe + lookUp, 24 * s, -0.9, 0.7); ctx.stroke();

  function robot(x, y, s, phase, o = {}) {
    const dir = o.dir || -1;
    ctx.save();
    ctx.translate(x, y);
    if (o.down) {  // caído

    }
    const sw = Math.sin(phase) * (o.walk ? 1 : 0);
    ctx.strokeStyle = '#0a1820'; ctx.fillStyle = '#0d222c'; ctx.lineCap = 'round'; ctx.lineWidth = 18 * s;
    limb(0, -100 * s, sw * 0.6, 52 * s, -Math.abs(sw) * 0.4, 50 * s, 18 * s);
    limb(0, -100 * s, -sw * 0.6, 52 * s, -Math.abs(sw) * 0.4, 50 * s, 18 * s);
    ctx.fillRect(-34 * s, -196 * s, 68 * s, 100 * s);
    ctx.fillStyle = '#10303a';
    ctx.fillRect(-28 * s, -238 * s, 56 * s, 40 * s);

    const eye = o.down ? 0.2 : 1;
    ctx.fillStyle = `rgba(233,9,49,${eye})`; ctx.fillRect(-20 * s + dir * 6 * s, -224 * s, 40 * s, 8 * s);
    ctx.fillStyle = P.cyan; ctx.fillRect(-34 * s, -170 * s, 6 * s, 50 * s); ctx.fillRect(28 * s, -170 * s, 6 * s, 50 * s);
    ctx.restore();

  function drone(x, y, s, t, o = {}) {
    if (o.spot) {  // holofote ciano varrendo
      const a = o.spot;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(x, y, x + Math.sin(a) * 900 * s, y + Math.cos(a) * 900 * s);
      g.addColorStop(0, 'rgba(154,232,255,0.45)'); g.addColorStop(1, 'rgba(154,232,255,0)');
      ctx.fillStyle = g;

      ctx.lineTo(x + Math.sin(a - 0.22) * 1000 * s, y + Math.cos(a - 0.22) * 1000 * s);
      ctx.lineTo(x + Math.sin(a + 0.22) * 1000 * s, y + Math.cos(a + 0.22) * 1000 * s);

    ctx.fillStyle = '#c8ccd4';
    ctx.beginPath(); ctx.ellipse(x, y, 46 * s, 18 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6a707c';
    ctx.fillRect(x - 70 * s, y - 6 * s, 140 * s, 6 * s);

    for (const k of [-1, 1]) {

      ctx.fillStyle = `rgba(200,210,220,${blur})`;
      ctx.beginPath(); ctx.ellipse(x + k * 70 * s, y - 10 * s, 34 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3cff6a'; ctx.beginPath(); ctx.arc(x, y + 4 * s, 7 * s, 0, Math.PI * 2); ctx.fill();

  function tracer(x0, y0, x1, y1, color, alpha = 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.restore();
  }
  function flash(x, y, s) {
    glow(x, y, 120 * s, 'rgba(255,230,140,1)');
    ctx.save(); ctx.fillStyle = '#fff6d0';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, r = (k % 2 ? 14 : 42) * s;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);

    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // --- cenários -------------------------------------------------------------------------------------------------
  function skyline(seed, baseY, minH, maxH, color, windows, offset, spacing = 1) {
    const r = rng(seed);
