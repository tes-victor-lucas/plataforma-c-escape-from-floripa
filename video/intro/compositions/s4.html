<template>
  <style>
      #root { position: absolute; inset: 0; overflow: hidden; background: #04050a; font-family: 'PixelGamer', monospace; }
      @font-face { font-family: 'PixelGamer'; src: url('assets/fonts/PixelGamer-Regular.otf'); }
      /* Como no jogo (src/main.ts): na PixelGamer, números e pontuação são desenhos; vêm da Pixeboy. */
      @font-face { font-family: 'PixelGamer'; src: url('assets/fonts/Pixeboy.ttf');
        unicode-range: U+24-26, U+2C, U+2E, U+30-3A; size-adjust: 140%; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .art { position: absolute; left: -8px; top: 0; width: 1936px; height: 1080px; image-rendering: pixelated; }
      .spr { position: absolute; overflow: hidden; }
      .spr img { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
      .cap { position: absolute; color: #ffffff; letter-spacing: 3px; text-shadow: 5px 5px 0 #000000; z-index: 12;
        white-space: nowrap; }
      .red { color: #e90931; }
      .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 520px;
        perspective-origin: 50% 12%; overflow: hidden; background: #04050a; }
      .plane { position: absolute; overflow: hidden; transform-origin: 50% 100%; }
      .plane img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  </style>
  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">
      <canvas id="s4-c" width="1280" height="720" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;"></canvas>
  </div>
  <script>
      const tl = gsap.timeline({ paused: true });
      /*
 * Centro de Florianópolis em 3D, modelado peça por peça (nada de foto colada) e animado pelo tempo.
 * Render realista na paleta do jogo: asfalto molhado, chuva, fumaça, brilho nas luzes, pessoas em silhueta.
 * render(t) é função pura de t: o HyperFrames busca quadros fora de ordem.
 */
function makeCity3D(canvas, cfg) {
  const W = 1280, H = 720;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = cfg.exposure || 1.15;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(cfg.sky);
  scene.fog = new THREE.Fog(cfg.fog, cfg.fogNear, cfg.fogFar);
  const camera = new THREE.PerspectiveCamera(cfg.fov || 60, W / H, 0.1, 400);

  // --- utilidades -------------------------------------------------------------------------------------------
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hash = (n) => rng(Math.floor(n) * 9301 + 49297)();
  const mats = {};
  const mat = (color, emissive = 0, intensity = 1) => {
    const key = color + ':' + emissive + ':' + intensity;
    if (!mats[key]) mats[key] = new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: intensity,
      roughness: 0.82, metalness: 0.04 });
    return mats[key];
  };
  const glow = (color) => mat(color, color, 1.6);
  // Brilho difuso: um disco de luz aditivo, para postes, neon, fogo e olhos dos drones.
  const haloTex = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.25, 'rgba(255,255,255,0.45)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  const smokeTex = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 4, 32, 32, 32);
    grad.addColorStop(0, 'rgba(40,36,40,0.85)');
    grad.addColorStop(1, 'rgba(20,18,22,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  function halo(color, size, opacity = 0.8) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size, size, 1);
    scene.add(s);
    return s;
  }
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  function box(parent, w, h, d, x, y, z, material) {
    const m = new THREE.Mesh(boxGeo, material);
    m.scale.set(w, h, d);
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  }
  function textTexture(text, fg, bg, w = 64, h = 20) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.font = 'bold ' + Math.floor(h * 0.72) + 'px monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + 1);
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    return t;
  }

  const PAL = {
    walls: [0xd8d2c4, 0xb8a58c, 0x8e5a48, 0x6e7280, 0xc9b28a, 0x9a6a58, 0x5a5e6a],
    frame: 0x6a1420, glass: 0x18233a, lit: 0xffcf6a, cyan: 0x5ce5f1, red: 0xe90931, dark: 0x101016,
    neon: [['BAR', '#ff3b6b'], ['TCHAY', '#5ce5f1'], ['FLORIA', '#e90931'], ['GATUS', '#ffd27a'], ['CAFE', '#5ce5f1']],
  };

  // --- prédio modelado -------------------------------------------------------------------------------------
  // `side` = -1 (esquerda da rua) ou 1; a fachada olha para x = 0.
  function building(r, side, z, depth, floors, opts = {}) {
    const g = new THREE.Group();
    const wallColor = opts.wall || PAL.walls[Math.floor(r() * PAL.walls.length)];
    const fh = 3.2, height = floors * fh + 1.2, width = 6;
    const face = side < 0 ? width / 2 : -width / 2;  // x local da fachada
    const out = side < 0 ? 1 : -1;                    // direção da rua
    box(g, width, height, depth, 0, height / 2, 0, mat(wallColor));
    // Faixas entre andares e cornija no topo.
    for (let f = 1; f <= floors; f++) box(g, 0.3, 0.25, depth + 0.2, face + out * 0.15, f * fh, 0, mat(0xe8e2d4));
    box(g, 0.6, 0.5, depth + 0.4, face + out * 0.3, height - 0.25, 0, mat(0xe8e2d4));
    box(g, 0.3, 0.7, depth, face + out * 0.05, height + 0.35, 0, mat(wallColor));
    // Janelas: moldura, vidro recuado (algumas acesas) e peitoril.
    const cols = Math.max(2, Math.floor(depth / 2.6));
    for (let f = 1; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const wz = -depth / 2 + (c + 0.5) * depth / cols;
        const wy = f * fh + 1.5;
        box(g, 0.18, 1.9, 1.25, face + out * 0.05, wy, wz, mat(PAL.frame));
        const v = r();
        const glassMat = v < 0.22 ? glow(PAL.lit) : v < 0.28 ? glow(PAL.cyan) : mat(PAL.glass);
        box(g, 0.1, 1.55, 0.95, face + out * 0.11, wy, wz, glassMat);
        box(g, 0.35, 0.12, 1.4, face + out * 0.18, wy - 1.0, wz, mat(0xe8e2d4));
        if (r() < 0.12) {  // sacada com gradil
          box(g, 1.0, 0.15, 1.6, face + out * 0.55, wy - 1.05, wz, mat(0x9a9a9a));
          for (let k = -2; k <= 2; k++) box(g, 0.06, 0.8, 0.06, face + out * 1.0, wy - 0.6, wz + k * 0.35, mat(0x222228));
        }
      }
    }
    // Térreo: porta, vitrine ou persiana e toldo listrado.
    for (let c = 0; c < cols; c++) {
      const wz = -depth / 2 + (c + 0.5) * depth / cols;
      const kind = r();
      if (kind < 0.35) {
        box(g, 0.2, 2.4, 1.3, face + out * 0.06, 1.2, wz, mat(0x7a1626));
      } else if (kind < 0.7) {
        box(g, 0.15, 2.0, 2.0, face + out * 0.06, 1.2, wz, glow(r() < 0.5 ? PAL.lit : 0xff9a4a));
      } else {
        box(g, 0.15, 2.2, 2.0, face + out * 0.06, 1.15, wz, mat(0x3a3e48));
      }
      if (r() < 0.4) {
        const aw = box(g, 1.3, 0.12, 2.0, face + out * 0.7, 2.75, wz, mat(r() < 0.5 ? 0x2a6a4a : 0x8a2030));
        aw.rotation.z = out * -0.35;
      }
    }
    // Letreiro neon saindo da parede.
    if (r() < (opts.signChance ?? 0.45)) {
      const [text, color] = PAL.neon[Math.floor(r() * PAL.neon.length)];
      const tex = textTexture(text, color, '#0a0a10');
      const signMat = new THREE.MeshBasicMaterial({ map: tex });
      const sy = 4.2 + r() * 2.5;
      const sz = -depth / 2 + 1 + r() * (depth - 2);
      box(g, 1.6, 0.9, 0.12, face + out * 1.0, sy, sz, mat(0x0a0a10)).rotation.y = 0;
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.75), signMat);
      plane.position.set(face + out * 1.0, sy, sz + 0.07);
      g.add(plane);
      const back = plane.clone();
      back.position.z = sz - 0.07;
      back.rotation.y = Math.PI;
      g.add(back);
      // Um sinal de neon pisca de vez em quando: guarda para o render.
      signs.push({ plane, back, seed: Math.floor(r() * 1000) });
    }
    g.position.set(side * 11, 0, z);
    scene.add(g);
    return g;
  }

  function palm(x, z, h) {
    const g = new THREE.Group();
    for (let i = 0; i < 6; i++) box(g, 0.35, h / 6, 0.35, Math.sin(i * 0.5) * 0.15, (i + 0.5) * h / 6, 0, mat(0x7a5a3a));
    for (let k = 0; k < 7; k++) {
      const leaf = box(g, 0.25, 0.12, 2.2, 0, h, 0, mat(k % 2 ? 0x3e8a3a : 0x2e6e2e));
      leaf.rotation.set(-0.5, (k / 7) * Math.PI * 2, 0);
      leaf.translateZ(1.0);
    }
    g.position.set(x, 0, z);
    scene.add(g);
    return g;
  }

  // --- Centro Cultural da Marinha, modelado ---------------------------------------------------------------
  function centroCultural(z) {
    const g = new THREE.Group();
    const white = mat(0xe6e4dc), shade = mat(0xbdbab0), red = mat(0x7a1626);
    box(g, 30, 13, 6, 0, 6.5, 0, white);
    box(g, 31, 0.8, 6.6, 0, 13.2, 0, shade);           // cornija
    box(g, 10, 2.2, 6.4, 0, 14.6, 0, white);            // ático central
    box(g, 10.6, 0.5, 6.8, 0, 15.8, 0, shade);
    for (let f = 0; f < 2; f++) {
      for (let c = -5; c <= 5; c++) {
        if (Math.abs(c) <= 1) continue;
        const x = c * 2.6, y = 3.4 + f * 5.2;
        box(g, 1.5, 2.8, 0.3, x, y, 3.05, red);
        box(g, 1.15, 2.4, 0.2, x, y, 3.15, mat(0x1c2a48));
        box(g, 1.15, 0.12, 0.25, x, y, 3.2, red);
        box(g, 1.9, 0.25, 0.6, x, y - 1.6, 3.2, shade);
      }
    }
    // Pórtico: colunas, sacada e portas duplas vermelhas.
    for (const x of [-3.4, -1.8, 1.8, 3.4]) box(g, 0.7, 11, 0.7, x, 5.5, 3.4, white);
    box(g, 6, 0.4, 1.6, 0, 6.2, 3.8, shade);
    for (let k = -6; k <= 6; k++) box(g, 0.12, 1.0, 0.12, k * 0.42, 6.9, 4.5, shade);
    box(g, 2.6, 4.0, 0.3, 0, 2.0, 3.2, red);
    box(g, 2.6, 3.6, 0.3, 0, 9.0, 3.2, red);
    for (const x of [-0.6, 0.6]) box(g, 0.08, 0.5, 0.1, x * 0.3, 2.0, 3.4, glow(0xd8b040));
    // Mureta com a placa e as palmeiras na frente.
    box(g, 30, 1.6, 0.8, 0, 0.8, 6.6, white);
    const plaque = new THREE.Mesh(new THREE.PlaneGeometry(7, 1.1),
      new THREE.MeshLambertMaterial({ map: textTexture('CENTRO CULTURAL', '#2a2a30', '#d8d6ce', 128, 20) }));
    plaque.position.set(0, 0.9, 7.02);
    g.add(plaque);
    g.position.set(0, 0, z);
    scene.add(g);
    palm(-9, z + 5.2, 5);
    palm(9, z + 5.2, 5.5);
    palm(-14, z + 5.4, 4.5);
    return g;
  }

  // --- pessoa articulada, de formas arredondadas -----------------------------------------------------------
  function person(colors) {
    const root = new THREE.Group();
    const body = new THREE.Group();
    root.add(body);
    const cap = (r, len, color) => new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 8), mat(color));
    const limb = (r, len, color) => {
      const pivot = new THREE.Group();
      const m = cap(r, len, color);
      m.position.y = -(len / 2 + r);  // gira pela articulação de cima
      pivot.add(m);
      return pivot;
    };
    const torso = cap(0.24, 0.42, colors.shirt);
    torso.scale.set(1.15, 1, 0.75);
    torso.position.y = 1.2;
    body.add(torso);
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.08, 10), mat(colors.belt || colors.legs));
    belt.scale.set(1.12, 1, 0.78);
    belt.position.y = 0.88;
    body.add(belt);
    const head = new THREE.Group();
    head.position.y = 1.62;
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), mat(colors.skin));
    skull.position.y = 0.18;
    head.add(skull);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.215, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.62), mat(colors.hair));
    hair.position.y = 0.2;
    head.add(hair);
    body.add(head);
    const arms = [-1, 1].map((s) => {
      const a = limb(0.075, 0.5, colors.shirt);
      a.position.set(s * 0.33, 1.48, 0);
      body.add(a);
      return a;
    });
    const legs = [-1, 1].map((s) => {
      const l = limb(0.1, 0.66, colors.legs);
      l.position.set(s * 0.13, 0.88, 0);
      const shoe = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.16, 3, 6), mat(colors.shoes));
      shoe.rotation.x = Math.PI / 2;
      shoe.position.set(0, -0.9, -0.05);
      l.add(shoe);
      root.add(l);
      return l;
    });
    scene.add(root);
    // Corrida: pernas e braços em oposição, cabeça atrasada, tronco inclinado, corpo quica no passo.
    root.userData.pose = (phase, run) => {
      const s = Math.sin(phase);
      legs[0].rotation.x = s * 0.95 * run;
      legs[1].rotation.x = -s * 0.95 * run;
      arms[0].rotation.x = -s * 0.85 * run;
      arms[1].rotation.x = s * 0.7 * run;   // amplitudes diferentes: nada em uníssono
      arms[0].rotation.z = -0.12; arms[1].rotation.z = 0.12;
      body.rotation.x = -0.22 * run;
      head.rotation.x = 0.18 * run + Math.sin(phase - 0.6) * 0.06 * run;
      body.position.y = Math.abs(Math.cos(phase)) * 0.09 * run;
    };
    root.userData.idle = (t) => {
      legs[0].rotation.x = legs[1].rotation.x = 0;
      arms[0].rotation.x = arms[1].rotation.x = 0;
      body.rotation.x = 0;
      body.position.y = Math.sin(t * 2.2) * 0.012;
      head.rotation.x = -0.35;  // olhando para cima
    };
    return root;
  }

  // --- drone -----------------------------------------------------------------------------------------------
  function drone() {
    const g = new THREE.Group();
    const shell = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 10), new THREE.MeshStandardMaterial({
      color: 0xc8ccd4, roughness: 0.35, metalness: 0.6 }));
    shell.scale.set(1, 0.42, 1);
    g.add(shell);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.05, 6, 20), mat(0x50545e));
    ring.rotation.x = Math.PI / 2;
    g.add(ring);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), glow(0x3cff6a));
    eye.position.set(0, -0.02, 0.5);
    g.add(eye);
    const eyeHalo = halo(0x3cff6a, 1.2, 0.9);
    const rotors = [];
    for (const [x, z] of [[-0.75, -0.75], [0.75, -0.75], [-0.75, 0.75], [0.75, 0.75]]) {
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 6), mat(0x50545e));
      arm.rotation.z = Math.PI / 2;
      arm.rotation.y = Math.atan2(z, x);
      arm.position.set(x / 2, 0.05, z / 2);
      g.add(arm);
      const rotor = new THREE.Group();
      rotor.position.set(x, 0.14, z);
      rotor.add(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.01, 18),
        new THREE.MeshBasicMaterial({ color: 0x9aa0b0, transparent: true, opacity: 0.22, depthWrite: false })));
      const blade = new THREE.Mesh(boxGeo, mat(0x2a2c34));
      blade.scale.set(0.8, 0.02, 0.06);
      rotor.add(blade);
      g.add(rotor);
      rotors.push(rotor);
    }
    const cone = new THREE.Mesh(new THREE.ConeGeometry(2.4, 9, 20, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x9ae8ff, transparent: true, opacity: 0.1, depthWrite: false,
        blending: THREE.AdditiveBlending }));
    cone.position.y = -4.6;
    g.add(cone);
    const spot = new THREE.PointLight(0x9ae8ff, 2.2, 16, 1.4);
    spot.position.y = -2;
    g.add(spot);
    scene.add(g);
    g.userData.rotors = rotors;
    g.userData.cone = cone;
    g.userData.eyeHalo = eyeHalo;
    g.userData.eye = eye;
    return g;
  }

  // --- fogo e explosões ------------------------------------------------------------------------------------
  const flameColors = [0xfff0a0, 0xffb040, 0xff5a1a];
  function fireColumn(x, z, size, seed) {
    const r = rng(seed);
    const flames = [], smoke = [], embers = [];
    for (let i = 0; i < 22; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: flameColors[i % 3], transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false }));
      scene.add(s);
      flames.push({ s, ox: (r() - 0.5) * size, oz: (r() - 0.5) * size * 0.5, off: r(), speed: 1.1 + r() * 0.8 });
    }
    for (let i = 0; i < 10; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0.8 }));
      scene.add(s);
      smoke.push({ s, ox: (r() - 0.5) * size, off: r(), speed: 0.25 + r() * 0.2 });
    }
    for (let i = 0; i < 18; i++) {
      const s = halo(0xffa040, 0.12, 1);
      embers.push({ s, ox: (r() - 0.5) * size, oz: (r() - 0.5) * size, off: r(), speed: 0.5 + r() * 0.6, drift: (r() - 0.5) * 2 });
    }
    const light = new THREE.PointLight(0xff7a2a, 0, 40, 1.1);
    light.position.set(x, 2.4, z);
    scene.add(light);
    const big = halo(0xff8030, size * 4, 0.35);
    big.position.set(x, size * 0.9, z);
    return { x, z, size, flames, smoke, embers, light, seed, big };
  }
  function drawFire(f, t, fi) {
    f.flames.forEach((p, i) => {
      const age = (t * p.speed + p.off) % 1;
      const sc = f.size * (1.3 - age) * 0.9;
      p.s.scale.set(sc, sc * 1.4, 1);
      p.s.material.opacity = 0.9 * (1 - age);
      p.s.position.set(f.x + p.ox * (1 - age * 0.6) + Math.sin(age * 8 + i) * 0.12, age * f.size * 2.2 + sc * 0.4, f.z + p.oz);
    });
    f.smoke.forEach((p, i) => {
      const age = (t * p.speed + p.off) % 1;
      const sc = f.size * (1.2 + age * 3);
      p.s.scale.set(sc, sc, 1);
      p.s.material.opacity = 0.75 * (1 - age);
      p.s.position.set(f.x + p.ox + age * 1.5, f.size * 2 + age * 9, f.z);
    });
    f.embers.forEach((p) => {
      const age = (t * p.speed + p.off) % 1;
      p.s.position.set(f.x + p.ox + p.drift * age, age * 7, f.z + p.oz);
      p.s.material.opacity = 1 - age;
    });
    f.light.intensity = 7 + hash(fi * 7 + f.seed) * 5;
    f.big.material.opacity = 0.28 + hash(fi * 5 + f.seed) * 0.14;
  }
  function explosion(seed) {
    const core = halo(0xfff0b0, 1, 1);
    const fireball = halo(0xff6a20, 1, 0.9);
    const r = rng(seed);
    const debris = [];
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(boxGeo, mat(i % 3 ? 0x2a2a30 : 0x6a4a3a));
      scene.add(m);
      debris.push({ m, vx: (r() - 0.5) * 9, vy: 4 + r() * 7, vz: (r() - 0.5) * 9, s: 0.12 + r() * 0.25, spin: r() * 9 });
    }
    const puffs = [];
    for (let i = 0; i < 8; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false }));
      scene.add(s);

  }
  function drawExplosion(e, age, x, y, z) {

      d.m.rotation.set(d.spin * age, d.spin * age * 0.7, 0);

  function car(x, z, color, rot) {

      const k = Math.min(1, t / cfg.duration);
      const e = k * k * (3 - 2 * k);
      camera.position.set(-2.4 + sx, 0.9 + sy, 13 - e * 1.2);
      camera.lookAt(0.5, 5 + e * 4, -6);
      if (actors.hero) {
        actors.hero.position.set(-3.6, 0, 9.4);
        actors.hero.rotation.y = Math.PI + 0.35;
        actors.hero.userData.idle(t);
      }
      actors.drones.forEach((d, i) => {
        const cd = cfg.drones[i];

        d.rotation.set(0.15, 0, -0.1);
        d.userData.rotors.forEach((ro, j) => { ro.rotation.y = t * 38 * (j % 2 ? 1 : -1); });
