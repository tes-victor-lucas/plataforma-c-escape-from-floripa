<template>
  <style>
      #root { position: absolute; inset: 0; overflow: hidden; background: #04050a; font-family: 'PixelGamer', monospace; }
      @font-face { font-family: 'PixelGamer'; src: url('assets/fonts/PixelGamer-Regular.otf'); }
      /* Como no jogo (src/main.ts): na PixelGamer, números e pontuação são desenhos; vêm da Pixeboy. */
      @font-face { font-family: 'PixelGamer'; src: url('assets/fonts/Pixeboy.ttf');
        unicode-range: U+24-26, U+2C, U+2E, U+30-3A; size-adjust: 140%; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .art { position: absolute; left: -8px; top: 0; width: 1936px; height: 1080px; image-rendering: pixelated; }
      .spr { position: absolute; overflow: hidden; }
      .spr img { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
      .cap { position: absolute; color: #ffffff; letter-spacing: 3px; text-shadow: 5px 5px 0 #000000; z-index: 12;
        white-space: nowrap; }
      .red { color: #e90931; }
      .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 520px;
        perspective-origin: 50% 12%; overflow: hidden; background: #04050a; }
      .plane { position: absolute; overflow: hidden; transform-origin: 50% 100%; }
      .plane img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  </style>
  <div id="root" data-composition-id="s6" data-width="1920" data-height="1080">
      <canvas id="s6-c" width="480" height="270" style="position:absolute;left:0;top:0;width:1920px;height:1080px;image-rendering:pixelated;z-index:1;"></canvas>
  </div>
  <script>
      const tl = gsap.timeline({ paused: true });
      /*
 * Centro de Florianópolis em 3D low-poly, modelado peça por peça (nada de foto colada) e animado pelo tempo.
 * Renderiza em 480x270 e o canvas é ampliado sem suavizar: 3D com cara de pixel art.
 * render(t) é função pura de t: o HyperFrames busca quadros fora de ordem.
 */
function makeCity3D(canvas, cfg) {
  const W = 480, H = 270;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(cfg.sky);
  scene.fog = new THREE.Fog(cfg.fog, cfg.fogNear, cfg.fogFar);
  const camera = new THREE.PerspectiveCamera(cfg.fov || 60, W / H, 0.1, 400);

  // --- utilidades -------------------------------------------------------------------------------------------
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hash = (n) => rng(Math.floor(n) * 9301 + 49297)();
  const mats = {};
  const mat = (color, emissive = 0, intensity = 1) => {
    const key = color + ':' + emissive + ':' + intensity;
    if (!mats[key]) mats[key] = new THREE.MeshLambertMaterial({ color, emissive, emissiveIntensity: intensity });
    return mats[key];
  };
  const glow = (color) => mat(color, color, 1);
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  function box(parent, w, h, d, x, y, z, material) {
    const m = new THREE.Mesh(boxGeo, material);
    m.scale.set(w, h, d);
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  }
  function textTexture(text, fg, bg, w = 64, h = 20) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.font = 'bold ' + Math.floor(h * 0.72) + 'px monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + 1);
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    return t;
  }

  const PAL = {
    walls: [0xd8d2c4, 0xb8a58c, 0x8e5a48, 0x6e7280, 0xc9b28a, 0x9a6a58, 0x5a5e6a],
    frame: 0x6a1420, glass: 0x18233a, lit: 0xffcf6a, cyan: 0x5ce5f1, red: 0xe90931, dark: 0x101016,
    neon: [['BAR', '#ff3b6b'], ['TCHAY', '#5ce5f1'], ['FLORIA', '#e90931'], ['GATUS', '#ffd27a'], ['CAFE', '#5ce5f1']],
  };

  // --- prédio modelado -------------------------------------------------------------------------------------
  // `side` = -1 (esquerda da rua) ou 1; a fachada olha para x = 0.
  function building(r, side, z, depth, floors, opts = {}) {
    const g = new THREE.Group();
    const wallColor = opts.wall || PAL.walls[Math.floor(r() * PAL.walls.length)];
    const fh = 3.2, height = floors * fh + 1.2, width = 6;
    const face = side < 0 ? width / 2 : -width / 2;  // x local da fachada
    const out = side < 0 ? 1 : -1;                    // direção da rua
    box(g, width, height, depth, 0, height / 2, 0, mat(wallColor));
    // Faixas entre andares e cornija no topo.
    for (let f = 1; f <= floors; f++) box(g, 0.3, 0.25, depth + 0.2, face + out * 0.15, f * fh, 0, mat(0xe8e2d4));
    box(g, 0.6, 0.5, depth + 0.4, face + out * 0.3, height - 0.25, 0, mat(0xe8e2d4));
    box(g, 0.3, 0.7, depth, face + out * 0.05, height + 0.35, 0, mat(wallColor));
    // Janelas: moldura, vidro recuado (algumas acesas) e peitoril.
    const cols = Math.max(2, Math.floor(depth / 2.6));
    for (let f = 1; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const wz = -depth / 2 + (c + 0.5) * depth / cols;
        const wy = f * fh + 1.5;
        box(g, 0.18, 1.9, 1.25, face + out * 0.05, wy, wz, mat(PAL.frame));
        const v = r();
        const glassMat = v < 0.22 ? glow(PAL.lit) : v < 0.28 ? glow(PAL.cyan) : mat(PAL.glass);
        box(g, 0.1, 1.55, 0.95, face + out * 0.11, wy, wz, glassMat);
        box(g, 0.35, 0.12, 1.4, face + out * 0.18, wy - 1.0, wz, mat(0xe8e2d4));
        if (r() < 0.12) {  // sacada com gradil
          box(g, 1.0, 0.15, 1.6, face + out * 0.55, wy - 1.05, wz, mat(0x9a9a9a));
          for (let k = -2; k <= 2; k++) box(g, 0.06, 0.8, 0.06, face + out * 1.0, wy - 0.6, wz + k * 0.35, mat(0x222228));
        }
      }
    }
    // Térreo: porta, vitrine ou persiana e toldo listrado.
    for (let c = 0; c < cols; c++) {
      const wz = -depth / 2 + (c + 0.5) * depth / cols;
      const kind = r();
      if (kind < 0.35) {
        box(g, 0.2, 2.4, 1.3, face + out * 0.06, 1.2, wz, mat(0x7a1626));
      } else if (kind < 0.7) {
        box(g, 0.15, 2.0, 2.0, face + out * 0.06, 1.2, wz, glow(r() < 0.5 ? PAL.lit : 0xff9a4a));
      } else {
        box(g, 0.15, 2.2, 2.0, face + out * 0.06, 1.15, wz, mat(0x3a3e48));
      }
      if (r() < 0.4) {
        const aw = box(g, 1.3, 0.12, 2.0, face + out * 0.7, 2.75, wz, mat(r() < 0.5 ? 0x2a6a4a : 0x8a2030));
        aw.rotation.z = out * -0.35;
      }
    }
    // Letreiro neon saindo da parede.
    if (r() < (opts.signChance ?? 0.45)) {
      const [text, color] = PAL.neon[Math.floor(r() * PAL.neon.length)];
      const tex = textTexture(text, color, '#0a0a10');
      const signMat = new THREE.MeshBasicMaterial({ map: tex });
      const sy = 4.2 + r() * 2.5;
      const sz = -depth / 2 + 1 + r() * (depth - 2);
      box(g, 1.6, 0.9, 0.12, face + out * 1.0, sy, sz, mat(0x0a0a10)).rotation.y = 0;
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.75), signMat);
      plane.position.set(face + out * 1.0, sy, sz + 0.07);
      g.add(plane);
      const back = plane.clone();
      back.position.z = sz - 0.07;
      back.rotation.y = Math.PI;
      g.add(back);
      // Um sinal de neon pisca de vez em quando: guarda para o render.
      signs.push({ plane, back, seed: Math.floor(r() * 1000) });
    }
    g.position.set(side * 11, 0, z);
    scene.add(g);
    return g;
  }

  function palm(x, z, h) {
    const g = new THREE.Group();
    for (let i = 0; i < 6; i++) box(g, 0.35, h / 6, 0.35, Math.sin(i * 0.5) * 0.15, (i + 0.5) * h / 6, 0, mat(0x7a5a3a));
    for (let k = 0; k < 7; k++) {
      const leaf = box(g, 0.25, 0.12, 2.2, 0, h, 0, mat(k % 2 ? 0x3e8a3a : 0x2e6e2e));
      leaf.rotation.set(-0.5, (k / 7) * Math.PI * 2, 0);
      leaf.translateZ(1.0);
    }
    g.position.set(x, 0, z);
    scene.add(g);
    return g;
  }

  // --- Centro Cultural da Marinha, modelado ---------------------------------------------------------------
  function centroCultural(z) {
    const g = new THREE.Group();
    const white = mat(0xe6e4dc), shade = mat(0xbdbab0), red = mat(0x7a1626);
    box(g, 30, 13, 6, 0, 6.5, 0, white);
    box(g, 31, 0.8, 6.6, 0, 13.2, 0, shade);           // cornija
    box(g, 10, 2.2, 6.4, 0, 14.6, 0, white);            // ático central
    box(g, 10.6, 0.5, 6.8, 0, 15.8, 0, shade);
    for (let f = 0; f < 2; f++) {
      for (let c = -5; c <= 5; c++) {
        if (Math.abs(c) <= 1) continue;
        const x = c * 2.6, y = 3.4 + f * 5.2;
        box(g, 1.5, 2.8, 0.3, x, y, 3.05, red);
        box(g, 1.15, 2.4, 0.2, x, y, 3.15, mat(0x1c2a48));
        box(g, 1.15, 0.12, 0.25, x, y, 3.2, red);
        box(g, 1.9, 0.25, 0.6, x, y - 1.6, 3.2, shade);
      }
    }
    // Pórtico: colunas, sacada e portas duplas vermelhas.
    for (const x of [-3.4, -1.8, 1.8, 3.4]) box(g, 0.7, 11, 0.7, x, 5.5, 3.4, white);
    box(g, 6, 0.4, 1.6, 0, 6.2, 3.8, shade);
    for (let k = -6; k <= 6; k++) box(g, 0.12, 1.0, 0.12, k * 0.42, 6.9, 4.5, shade);
    box(g, 2.6, 4.0, 0.3, 0, 2.0, 3.2, red);
    box(g, 2.6, 3.6, 0.3, 0, 9.0, 3.2, red);
    for (const x of [-0.6, 0.6]) box(g, 0.08, 0.5, 0.1, x * 0.3, 2.0, 3.4, glow(0xd8b040));
    // Mureta com a placa e as palmeiras na frente.
    box(g, 30, 1.6, 0.8, 0, 0.8, 6.6, white);
    const plaque = new THREE.Mesh(new THREE.PlaneGeometry(7, 1.1),
      new THREE.MeshLambertMaterial({ map: textTexture('CENTRO CULTURAL', '#2a2a30', '#d8d6ce', 128, 20) }));
    plaque.position.set(0, 0.9, 7.02);
    g.add(plaque);
    g.position.set(0, 0, z);
    scene.add(g);
    palm(-9, z + 5.2, 5);
    palm(9, z + 5.2, 5.5);
    palm(-14, z + 5.4, 4.5);
    return g;
  }

  // --- pessoa em blocos, articulada ------------------------------------------------------------------------
  function person(colors) {
    const root = new THREE.Group();
    const body = new THREE.Group();
    root.add(body);
    const part = (w, h, d, color) => {
      const pivot = new THREE.Group();
      const m = new THREE.Mesh(boxGeo, mat(color));
      m.scale.set(w, h, d);
      m.position.y = -h / 2;  // gira pela articulação de cima
      pivot.add(m);
      return pivot;
    };
    const torso = new THREE.Mesh(boxGeo, mat(colors.shirt));
    torso.scale.set(0.62, 0.72, 0.36);
    torso.position.y = 1.18;
    body.add(torso);
    box(body, 0.64, 0.1, 0.38, 0, 0.84, 0, mat(colors.belt || colors.legs));
    const head = new THREE.Group();
    head.position.y = 1.56;
    box(head, 0.42, 0.42, 0.4, 0, 0.21, 0, mat(colors.skin));
    box(head, 0.46, 0.18, 0.44, 0, 0.4, 0.02, mat(colors.hair));
    box(head, 0.46, 0.3, 0.12, 0, 0.26, 0.2, mat(colors.hair));  // cabelo atrás (a câmera vê as costas)
    body.add(head);
    const arms = [-1, 1].map((s) => {
      const a = part(0.18, 0.66, 0.2, colors.shirt);
      a.position.set(s * 0.41, 1.5, 0);
      body.add(a);
      return a;
    });
    const legs = [-1, 1].map((s) => {
      const l = part(0.24, 0.84, 0.26, colors.legs);
      l.position.set(s * 0.16, 0.84, 0);
      const shoe = new THREE.Mesh(boxGeo, mat(colors.shoes));
      shoe.scale.set(0.26, 0.14, 0.36);
      shoe.position.set(0, -0.86, -0.04);
      l.add(shoe);
      root.add(l);
      return l;
    });
    scene.add(root);
    // Corrida: pernas e braços em oposição, cabeça atrasada, tronco inclinado, corpo quica no passo.
    root.userData.pose = (phase, run) => {
      const s = Math.sin(phase);
      legs[0].rotation.x = s * 0.95 * run;
      legs[1].rotation.x = -s * 0.95 * run;
      arms[0].rotation.x = -s * 0.85 * run;
      arms[1].rotation.x = s * 0.7 * run;   // amplitudes diferentes: nada em uníssono
      arms[0].rotation.z = -0.12; arms[1].rotation.z = 0.12;
      body.rotation.x = -0.22 * run;          // inclina para a frente (a câmera está atrás, em +z)
      head.rotation.x = 0.18 * run + Math.sin(phase - 0.6) * 0.06 * run;
      body.position.y = Math.abs(Math.cos(phase)) * 0.09 * run;
    };
    root.userData.idle = (t) => {
      legs[0].rotation.x = legs[1].rotation.x = 0;
      arms[0].rotation.x = arms[1].rotation.x = 0;
      body.rotation.x = 0;
      body.position.y = Math.sin(t * 2.2) * 0.012;
      head.rotation.x = -0.35;  // olhando para cima
    };
    return root;
  }

  // --- drone -----------------------------------------------------------------------------------------------
  function drone() {
    const g = new THREE.Group();
    box(g, 0.9, 0.35, 0.9, 0, 0, 0, mat(0xc8ccd4));
    box(g, 0.5, 0.2, 0.5, 0, 0.25, 0, mat(0x8a90a0));
    box(g, 0.22, 0.16, 0.05, 0, 0, 0.47, glow(0x3cff6a));
    const rotors = [];
    for (const [x, z] of [[-0.7, -0.7], [0.7, -0.7], [-0.7, 0.7], [0.7, 0.7]]) {
      box(g, 0.08, 0.06, 0.08, x / 2, 0.05, z / 2, mat(0x50545e)).scale.set(Math.abs(x) + 0.1, 0.06, 0.1);
      const rotor = new THREE.Group();
      rotor.position.set(x, 0.18, z);
      box(rotor, 0.9, 0.03, 0.1, 0, 0, 0, mat(0x2a2c34));
      box(rotor, 0.1, 0.03, 0.9, 0, 0, 0, mat(0x2a2c34));
      g.add(rotor);
      rotors.push(rotor);
    }
    for (const x of [-0.3, 0.3]) box(g, 0.06, 0.4, 0.06, x, -0.35, 0, mat(0x50545e));
    // Holofote: um cone translúcido para baixo e uma luz de verdade.
    const cone = new THREE.Mesh(new THREE.ConeGeometry(2.4, 9, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x9ae8ff, transparent: true, opacity: 0.12, depthWrite: false }));
    cone.position.y = -4.6;
    g.add(cone);
    const spot = new THREE.PointLight(0x9ae8ff, 1.4, 14, 1.5);
    spot.position.y = -2;
    g.add(spot);
    scene.add(g);
    g.userData.rotors = rotors;
    g.userData.cone = cone;
    return g;
  }

  // --- fogo e explosões ------------------------------------------------------------------------------------
  const flameMats = [glow(0xffe08a), glow(0xffa030), glow(0xe9401a), mat(0x2a2628)];
  function fireColumn(x, z, size, seed) {
    const parts = [];
    const r = rng(seed);
    for (let i = 0; i < 26; i++) {
      const m = new THREE.Mesh(boxGeo, flameMats[0]);
      scene.add(m);
      parts.push({ m, ox: (r() - 0.5) * size, oz: (r() - 0.5) * size * 0.6, off: r(), speed: 0.9 + r() * 0.7 });
    }
    const light = new THREE.PointLight(0xff7a2a, 0, 36, 1.1);
    light.position.set(x, 2.2, z);
    scene.add(light);
    return { x, z, size, parts, light, seed };
  }
  function drawFire(f, t, fi) {
    f.parts.forEach((p, i) => {
      const age = (t * p.speed + p.off) % 1;                // cada partícula sobe e recomeça
      const smoke = i % 5 === 4;
      const h = f.size * (smoke ? 3.4 : 2.4) * age;
      p.m.material = smoke ? flameMats[3] : flameMats[Math.min(2, Math.floor(age * 3))];
      const s = (smoke ? 0.9 : 0.75) * f.size * 0.42 * (smoke ? 0.4 + age : 1 - age * 0.7);
      p.m.scale.set(s, s, s);
      p.m.position.set(f.x + p.ox * (1 - age * 0.5) + Math.sin(age * 9 + i) * 0.15, h + s / 2, f.z + p.oz);
    });
    f.light.intensity = 6 + hash(fi * 7 + f.seed) * 4;
  }
  function explosion(seed) {
    const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), glow(0xffd070));
    const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), glow(0xe9401a));
    scene.add(ball); scene.add(shell);
    const r = rng(seed);
    const debris = [];
    for (let i = 0; i < 14; i++) {
      const m = new THREE.Mesh(boxGeo, mat(i % 3 ? 0x2a2a30 : 0x6a4a3a));
      scene.add(m);
      debris.push({ m, vx: (r() - 0.5) * 9, vy: 4 + r() * 7, vz: (r() - 0.5) * 9, s: 0.15 + r() * 0.3, spin: r() * 9 });
    }
    const light = new THREE.PointLight(0xffb060, 0, 50, 1.2);
    scene.add(light);
    return { ball, shell, debris, light };
  }
  function drawExplosion(e, age, x, y, z) {
    const on = age >= 0 && age < 1.2;
    e.ball.visible = e.shell.visible = on && age < 0.5;
    e.debris.forEach((d) => { d.m.visible = on; });
    e.light.intensity = on ? Math.max(0, 14 * (1 - age / 0.6)) : 0;
    if (!on) return;
    const k = age / 0.5;
    e.ball.scale.setScalar(0.8 + k * 3.6);
    e.shell.scale.setScalar(1.2 + k * 4.6);
    e.ball.position.set(x, y + k, z);
    e.shell.position.set(x, y + k * 1.2, z);
    e.light.position.set(x, y + 1.5, z + 1);
    e.debris.forEach((d) => {
      d.m.scale.setScalar(d.s);
      d.m.position.set(x + d.vx * age, Math.max(0.1, y + d.vy * age - 9.8 * age * age / 2), z + d.vz * age);
      d.m.rotation.set(d.spin * age, d.spin * age * 0.7, 0);
    });
  }

  // --- rua ---------------------------------------------------------------------------------------------------
  const signs = [];
  function street(length) {
    box(scene, 8, 0.1, length, 0, -0.05, -length / 2 + 20, mat(0x24262e));
    for (const s of [-1, 1]) {
      box(scene, 3.6, 0.3, length, s * 5.8, 0.1, -length / 2 + 20, mat(0x5a5c66));
      box(scene, 0.2, 0.32, length, s * 4.0, 0.12, -length / 2 + 20, mat(0x8a8c96));
    }
    for (let z = 18; z > -length + 20; z -= 5) box(scene, 0.22, 0.02, 2.2, 0, 0.01, z, mat(0xd6a834));
    const lamps = [];
    for (let z = 10, k = 0; z > -length + 20; z -= 14, k++) {
      const side = k % 2 ? 1 : -1;
      box(scene, 0.14, 5, 0.14, side * 4.6, 2.5, z, mat(0x2a2c34));
      box(scene, 1.2, 0.12, 0.2, side * 4.1, 5.0, z, mat(0x2a2c34));
      box(scene, 0.5, 0.18, 0.4, side * 3.6, 4.9, z, glow(0xffd890));
      lamps.push({ x: side * 3.6, z });
    }
    return lamps;
  }
  function car(x, z, color, rot) {
    const g = new THREE.Group();
    box(g, 1.8, 0.7, 3.8, 0, 0.55, 0, mat(color));
    box(g, 1.6, 0.6, 2.0, 0, 1.15, -0.2, mat(0x1a2030));
    for (const [wx, wz] of [[-0.9, 1.2], [0.9, 1.2], [-0.9, -1.2], [0.9, -1.2]]) box(g, 0.3, 0.6, 0.6, wx, 0.3, wz, mat(0x111114));
    g.position.set(x, 0, z);
    g.rotation.y = rot;
    scene.add(g);
  }

  // --- monta a cena pedida -----------------------------------------------------------------------------------
  scene.add(new THREE.HemisphereLight(cfg.skyLight, cfg.groundLight, cfg.hemi));
  const r = rng(cfg.seed);
  const actors = {};
  if (cfg.kind === 'street') {
    const lamps = street(cfg.length);
    lamps.slice(0, 4).forEach((l) => {
      const pl = new THREE.PointLight(0xffd890, 1.2, 16, 1.6);
      pl.position.set(l.x, 4.6, l.z);
      scene.add(pl);
    });
    for (const side of [-1, 1]) {
      let z = 16;
      while (z > -cfg.length + 20) {
        const depth = 7 + Math.floor(r() * 6);
        building(r, side, z - depth / 2, depth, 2 + Math.floor(r() * 4));
