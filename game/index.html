<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma C: Escape From Floripa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            color: rgba(255, 255, 255, 0.87);
            background-color: #000000;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000000;
        }

        #fullscreen-button {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: grid;
            width: 42px;
            height: 42px;
            padding: 0;
            background: transparent;
            border: 0;
            border-radius: 50%;
            place-items: center;
            cursor: pointer;
        }

        #game-container.gameplay-active #fullscreen-button {
            top: 8px;
            right: 58px;
        }

        #fullscreen-button:hover,
        #fullscreen-button:focus-visible {
            transform: scale(1.06);
            outline: 2px solid #5ce5f1;
            outline-offset: 1px;
        }

        #fullscreen-button:disabled,
        #fullscreen-button[data-fullscreen='true'] {
            display: none;
        }

        #fullscreen-button .action-button-icon {
            width: 100%;
            height: 100%;
            background-image: url('./public/assets/ui/fullscreen.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="game-container">
            <button
                id="fullscreen-button"
                type="button"
                data-fullscreen="false"
                aria-label="Entrar em tela cheia"
                title="Entrar em tela cheia"
            >
                <span class="action-button-icon" aria-hidden="true"></span>
            </button>
        </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
